[package]
name = "actix-tls"
version = "3.6.1"
authors = ["Nikolay Kim <fafhrd91@gmail.com>", "Rob Ede <robjtede@icloud.com>"]
description = "TLS acceptor and connector services for Actix ecosystem"
keywords = ["network", "tls", "ssl", "async", "transport"]
repository = "https://github.com/actix/actix-net.git"
categories = ["network-programming", "asynchronous", "cryptography"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo_check_external_types]
allowed_external_types = ["actix_service::*", "actix_utils::*", "futures_core::*", "tokio::*"]

[features]
default = ["accept", "connect"]

# enable acceptor services
accept = []

# enable connector services
connect = []

# use openssl impls
openssl = ["dep:tls-openssl", "dep:tokio-openssl"]

# use rustls v0.23 impls
rustls-0_23 = ["dep:tokio-rustls-026", "dep:rustls-pki-types-1"]
rustls-0_23-webpki-roots = ["rustls-0_23", "dep:webpki-roots-026"]
rustls-0_23-native-roots = ["rustls-0_23", "dep:rustls-native-certs-08"]

# use native-tls impls
native-tls = ["dep:tokio-native-tls"]

# support http::Uri as connect address
uri = ["dep:http-0_2", "dep:http-1"]

[dependencies]
actix-rt = { version = "2.14", default-features = false, features = ["net"] }
actix-service = "2"
actix-utils = "3"
futures-core = { version = "0.3.7", default-features = false, features = ["alloc"] }
impl-more = "0.3"
pin-project-lite = "0.2.7"
tokio = "1.44.2"
tokio-util = "0.7"
tracing = { version = "0.1.30", default-features = false, features = ["log"] }

# uri
http-0_2 = { package = "http", version = "0.2.3", optional = true }
http-1 = { package = "http", version = "1", optional = true }

# openssl
tls-openssl = { package = "openssl", version = "0.10.55", optional = true }
tokio-openssl = { version = "0.6", optional = true }

# rustls PKI types
rustls-pki-types-1 = { package = "rustls-pki-types", version = "1", optional = true }

# rustls v0.23
tokio-rustls-026 = { package = "tokio-rustls", version = "0.26", default-features = false, optional = true }

# webpki-roots used with rustls features
webpki-roots-026 = { package = "webpki-roots", version = "0.26", optional = true }

# native root certificates for rustls impls
rustls-native-certs-08 = { package = "rustls-native-certs", version = "0.8", optional = true }

# native-tls
tokio-native-tls = { version = "0.3", optional = true }

[dev-dependencies]
actix-codec = "0.5"
actix-rt = "2.2"
actix-server = "2"
arc-swap = "1.9"
bytes = "1"
futures-util = { version = "0.3.17", default-features = false, features = ["sink"] }
hickory-resolver = "0.26.1"
itertools = "0.14"
pretty_env_logger = "0.5"
rcgen = "0.14"
rustls-pemfile = "2"
tokio = { version = "1.51", features = ["macros", "rt"] }
tokio-rustls-026 = { package = "tokio-rustls", version = "0.26" }

[[example]]
name = "accept-rustls"
required-features = ["accept", "rustls-0_23"]

[[example]]
name = "hot-reload-rustls"
required-features = ["accept", "rustls-0_23"]

[[example]]
name = "hot-reload-openssl"
required-features = ["accept", "openssl"]

[lints.rust]
rust_2018_idioms = "deny"
nonstandard_style = "deny"
future_incompatible = "deny"
missing_docs = { level = "warn", priority = -1 }

[lints.clippy]
uninlined_format_args = "warn"
disallowed_names = "warn"

# Dependencies are feature-gated across accept, connect, and TLS backends.
# `cargo ci-check-lib` checks partial combinations, so valid dependencies can
# appear unused when their feature is not enabled.
[lints.cargo]
unused_dependencies = "allow"
