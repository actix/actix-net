[package]
name = "resolvconf"
version = "0.1.1"
description = "Read the platform's configured DNS resolver address"
authors = ["Rob Ede <robjtede@icloud.com>"]
repository = "https://github.com/actix/actix-net/tree/main/resolvconf"
keywords = ["dns", "resolver", "network", "configuration", "resolvconf"]
categories = ["network-programming", "os"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-freebsd",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
ipconfig = { version = "0.3.2", default-features = false }

[dev-dependencies]
hickory-resolver = { version = "0.26", default-features = false, features = [
  "tokio",
  "https-aws-lc-rs",
  "rustls-platform-verifier",
] }
tokio = { version = "1.51", features = ["macros", "rt"] }

[target.'cfg(any(target_os = "dragonfly", target_os = "freebsd", target_os = "linux", target_os = "netbsd", target_os = "openbsd"))'.dev-dependencies]
indoc = "2"

[lints]
workspace = true
