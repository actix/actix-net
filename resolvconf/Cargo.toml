[package]
name = "resolvconf"
version = "0.1.0"
description = "Read the configured system DNS resolver address"
authors = ["Rob Ede <robjtede@icloud.com>"]
repository = "https://github.com/actix/actix-net/tree/main/resolvconf"
keywords = ["dns", "resolver", "network", "configuration"]
categories = ["network-programming", "os"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
indoc = "2"

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
ipconfig = { version = "0.3.4", default-features = false }

[dev-dependencies]
hickory-resolver = { version = "0.26.3", default-features = false, features = [
  "https-ring",
  "tokio",
  "webpki-roots",
] }
tokio = { version = "1.51", features = ["macros", "rt"] }

[lints]
workspace = true
