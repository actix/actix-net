name: CI

on:
  pull_request: {}
  merge_group: { types: [checks_requested] }
  push: { branches: [main] }

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read_msrv:
    name: Read MSRV
    uses: actions-rust-lang/msrv/.github/workflows/msrv.yml@983d9d27da8fe8aaa47732160b7a14805004d4b2 # v0.1.3

  build_and_test:
    needs:
      - read_msrv

    strategy:
      fail-fast: false
      matrix:
        # prettier-ignore
        target:
          - { name: Linux, os: blacksmith-2vcpu-ubuntu-2404, triple: x86_64-unknown-linux-gnu }
          - { name: macOS, os: blacksmith-6vcpu-macos-latest, triple: x86_64-apple-darwin }
          - { name: Windows, os: blacksmith-2vcpu-windows-2025, triple: x86_64-pc-windows-msvc }
        version:
          - { name: msrv, version: "${{ needs.read_msrv.outputs.msrv }}" }
          - { name: stable, version: stable }

    name: ${{ matrix.target.name }} / ${{ matrix.version.name }}
    runs-on: ${{ matrix.target.os }}

    env: {}

    steps:
      - name: Setup Routing
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.3

      - name: Checkout
        uses: useblacksmith/checkout@v1.8.2
        with:
          persist-credentials: false

      - name: Free Disk Space
        if: runner.os == 'Linux'
        run: ./scripts/free-disk-space.sh

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@main

      - name: Install nasm
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1.5.2

      - name: Install OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          choco install openssl --version=1.1.1.2100 -y --no-progress
          echo 'OPENSSL_DIR=C:\Program Files\OpenSSL' >> $GITHUB_ENV
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV

      - name: Install Rust (${{ matrix.version.name }})
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: ${{ matrix.version.version }}

      - name: Install just, cargo-hack, cargo-nextest, cargo-ci-cache-clean
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-hack,cargo-nextest,cargo-ci-cache-clean

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: workaround MSRV issues
        if: matrix.version.name == 'msrv'
        run: just downgrade-for-msrv

      - name: check lib
        if: runner.os != 'Linux'
        run: cargo ci-check-lib
      - name: check lib
        if: runner.os == 'Linux'
        run: cargo ci-check-lib-linux
      - name: check lib
        run: cargo ci-check-min

      - name: check full
        if: runner.os != 'Linux'
        run: cargo ci-check
      - name: check all
        if: runner.os == 'Linux'
        run: cargo ci-check-linux

      - name: tests
        run: just test

      - name: CI cache clean
        run: cargo-ci-cache-clean

  build_only:
    if: github.event_name == 'push'

    needs:
      - read_msrv

    strategy:
      fail-fast: false
      matrix:
        # prettier-ignore
        target:
          - { name: Windows (MinGW), triple: x86_64-pc-windows-gnu }
          - { name: illumos, triple: x86_64-unknown-illumos }
        version:
          - { name: msrv, version: "${{ needs.read_msrv.outputs.msrv }}" }
          - { name: stable, version: stable }

    name: ${{ matrix.target.name }} / ${{ matrix.version.name }} (build only)
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1.8.2
        with:
          persist-credentials: false

      - name: Install MinGW binutils
        if: matrix.target.triple == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-mingw-w64-x86-64

      - name: Install Rust (${{ matrix.version.name }})
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: ${{ matrix.version.version }}
          target: ${{ matrix.target.triple }}

      - name: Install just, cargo-hack, cargo-ci-cache-clean
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-hack,cargo-ci-cache-clean
          fallback: cargo-binstall

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: workaround MSRV issues
        if: matrix.version.name == 'msrv'
        run: just downgrade-for-msrv

      - name: Build libraries without default features
        run: cargo hack --workspace build --lib --no-default-features --no-dev-deps --target ${{ matrix.target.triple }}

      - name: Build libraries with default features
        run: cargo hack --workspace build --lib --no-dev-deps --target ${{ matrix.target.triple }}

      - name: CI cache clean
        run: cargo-ci-cache-clean

  miri:
    name: Miri
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1.8.2
        with:
          persist-credentials: false

      - name: Install Rust (nightly with Miri)
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: nightly
          components: miri

      - name: Test local-waker with Miri
        run: cargo miri test -p local-waker
        env:
          CARGO_BUILD_WARNINGS: warn

  docs:
    name: Documentation
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1.8.2
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: nightly

      - name: Install just
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: just

      - name: doc tests
        run: just test-docs
