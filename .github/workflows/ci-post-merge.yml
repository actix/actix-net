name: CI (post-merge)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_nightly:
    strategy:
      fail-fast: false
      matrix:
        # prettier-ignore
        target:
          - { name: Linux, os: blacksmith-2vcpu-ubuntu-2404, triple: x86_64-unknown-linux-gnu }
          - { name: macOS, os: blacksmith-6vcpu-macos-latest, triple: x86_64-apple-darwin }
          - { name: Windows, os: blacksmith-2vcpu-windows-2025, triple: x86_64-pc-windows-msvc }
          - { name: Windows (MinGW), os: blacksmith-2vcpu-windows-2025, triple: x86_64-pc-windows-gnu }
        version:
          - nightly

    name: ${{ matrix.target.name }} / ${{ matrix.version }}
    runs-on: ${{ matrix.target.os }}

    env: {}

    steps:
      - name: Setup Routing
        if: contains(matrix.target.os, 'macos')
        run: sudo ifconfig lo0 alias 127.0.0.3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space
        if: contains(matrix.target.os, 'ubuntu')
        run: ./scripts/free-disk-space.sh

      - name: Setup mold linker
        if: contains(matrix.target.os, 'ubuntu')
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # staging

      - name: Install nasm
        if: contains(matrix.target.os, 'windows')
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install OpenSSL
        if: contains(matrix.target.os, 'windows')
        shell: bash
        run: |
          set -e
          choco install openssl --version=1.1.1.2100 -y --no-progress
          echo 'OPENSSL_DIR=C:\Program Files\OpenSSL' >> $GITHUB_ENV
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV

      - name: Install Rust (${{ matrix.version }})
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ matrix.version }}

      - name: Install just, cargo-hack, cargo-nextest, cargo-ci-cache-clean
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: just,cargo-hack,cargo-nextest,cargo-ci-cache-clean

      - name: check lib
        if: ${{ !contains(matrix.target.os, 'ubuntu') && matrix.target.triple != 'x86_64-pc-windows-gnu' }}
        run: cargo ci-check-lib
      - name: check lib
        if: contains(matrix.target.os, 'ubuntu')
        run: cargo ci-check-lib-linux
      - name: check lib
        if: matrix.target.triple == 'x86_64-pc-windows-gnu'
        run: cargo ci-check-min

      - name: check full
        # TODO: compile OpenSSL and run tests on MinGW
        if: ${{ !contains(matrix.target.os, 'ubuntu') && matrix.target.triple != 'x86_64-pc-windows-gnu' }}
        run: cargo ci-check
      - name: check all
        if: contains(matrix.target.os, 'ubuntu')
        run: cargo ci-check-linux

      - name: tests
        run: just test

      # TODO: re-instate some io-uring tests PRs
      # - name: tests
      #   if: contains(matrix.target.os, 'ubuntu')
      #   run: >-
      #     sudo bash -c "
      #     ulimit -Sl 512
      #     && ulimit -Hl 512
      #     && PATH=$PATH:/usr/share/rust/.cargo/bin
      #     && RUSTUP_TOOLCHAIN=${{ matrix.version }} cargo ci-test-rustls-020
      #     && RUSTUP_TOOLCHAIN=${{ matrix.version }} cargo ci-test-rustls-021
      #     && RUSTUP_TOOLCHAIN=${{ matrix.version }} cargo ci-test-linux
      #     "

      - name: CI cache clean
        run: cargo-ci-cache-clean

  minimal-versions:
    name: minimal versions
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: nightly

      - name: Install cargo-hack & cargo-minimal-versions
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-hack,cargo-minimal-versions

      - name: Check With Minimal Versions
        run: cargo minimal-versions check
