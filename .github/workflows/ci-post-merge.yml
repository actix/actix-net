name: CI (post-merge)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_nightly:
    strategy:
      fail-fast: false
      matrix:
        # prettier-ignore
        target:
          - { name: Linux, os: blacksmith-2vcpu-ubuntu-2404, triple: x86_64-unknown-linux-gnu }
          - { name: macOS, os: blacksmith-6vcpu-macos-latest, triple: x86_64-apple-darwin }
          - { name: Windows, os: blacksmith-2vcpu-windows-2025, triple: x86_64-pc-windows-msvc }
        version:
          - nightly

    name: ${{ matrix.target.name }} / ${{ matrix.version }}
    runs-on: ${{ matrix.target.os }}

    env: {}

    steps:
      - name: Setup Routing
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.3

      - name: Checkout
        uses: useblacksmith/checkout@v1.8.3
        with:
          persist-credentials: false

      - name: Free Disk Space
        if: runner.os == 'Linux'
        run: ./scripts/free-disk-space.sh

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@main

      - name: Install nasm
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1.5.2

      - name: Install OpenSSL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          choco install openssl --version=1.1.1.2100 -y --no-progress
          echo 'OPENSSL_DIR=C:\Program Files\OpenSSL' >> $GITHUB_ENV
          echo "RUSTFLAGS=-C target-feature=+crt-static" >> $GITHUB_ENV

      - name: Install Rust (${{ matrix.version }})
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: ${{ matrix.version }}

      - name: Install just, cargo-hack, cargo-nextest, cargo-ci-cache-clean
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: just,cargo-hack,cargo-nextest,cargo-ci-cache-clean

      - name: check lib
        if: runner.os != 'Linux'
        run: cargo ci-check-lib
      - name: check lib
        if: runner.os == 'Linux'
        run: cargo ci-check-lib-linux

      - name: check full
        if: runner.os != 'Linux'
        run: cargo ci-check
      - name: check all
        if: runner.os == 'Linux'
        run: cargo ci-check-linux

      - name: tests
        run: just test

      - name: CI cache clean
        run: cargo-ci-cache-clean

  build_only_nightly:
    strategy:
      fail-fast: false
      matrix:
        # prettier-ignore
        target:
          - { name: Windows (MinGW), triple: x86_64-pc-windows-gnu }
          - { name: illumos, triple: x86_64-unknown-illumos }
        version:
          - nightly

    name: ${{ matrix.target.name }} / ${{ matrix.version }} (build only)
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1.8.3
        with:
          persist-credentials: false

      - name: Install MinGW binutils
        if: matrix.target.triple == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y binutils-mingw-w64-x86-64

      - name: Install Rust (${{ matrix.version }})
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: ${{ matrix.version }}
          target: ${{ matrix.target.triple }}

      - name: Install cargo-hack, cargo-ci-cache-clean
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-hack,cargo-ci-cache-clean

      - name: Build libraries without default features
        run: cargo hack --workspace build --lib --no-default-features --no-dev-deps --target ${{ matrix.target.triple }}

      - name: Build libraries with default features
        run: cargo hack --workspace build --lib --no-dev-deps --target ${{ matrix.target.triple }}

      - name: CI cache clean
        run: cargo-ci-cache-clean

  minimal-versions:
    name: minimal versions
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1.8.3
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: nightly

      - name: Install cargo-hack & cargo-minimal-versions
        uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-hack,cargo-minimal-versions

      - name: Check With Minimal Versions
        run: cargo minimal-versions check
