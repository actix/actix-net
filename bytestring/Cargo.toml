[package]
name = "bytestring"
version = "1.6.0"
description = "A UTF-8 encoded read-only string using `Bytes` as storage"
authors = ["Nikolay Kim <fafhrd91@gmail.com>", "Rob Ede <robjtede@icloud.com>"]
keywords = ["string", "bytes", "utf8", "web", "bytestring"]
categories = ["no-std", "web-programming"]
homepage.workspace = true
repository = "https://github.com/actix/actix-net/tree/main/bytestring"
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["bytes::*", "serde_core::*"]

[features]
default = []
serde = ["dep:serde_core"]
simd = ["dep:simdutf8"]
std = ["simdutf8?/std"]

[dependencies]
bytes = { version = "1.9", default-features = false }
serde_core = { version = "1", optional = true }
simdutf8 = { version = "0.1.5", optional = true, default-features = false }

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "4" }
serde_json = "1"
static_assertions = "1.1"

[[bench]]
name = "utf8"
harness = false

[lints]
workspace = true
